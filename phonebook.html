<!DOCTYPE html>
<html>
<head>
  <title>Phone Book</title>
  <style>
    #contacts{
      height: 500px;
      width: 400px;
      margin: auto;
      box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
      display: grid;
      grid-template-columns: auto;
      gap: 10px;
      background-color:aliceblue;
    }

    .deletebtn{
      display: flex;
      flex-direction: row;
    }

  </style>
</head>
<body>
  <div id="contacts"> 
  <h1 style="margin-left: 120px; color: darkred;">Phone Book</h1>

  <!-- Add Contact -->
  <input type="text" id="name" placeholder="Enter Name" style="width: 200px; margin-left: 100px;"/>
  <input type="text" id="phone" placeholder="Enter Phone Number"style="width: 200px; margin-left: 100px;" />
  <button onclick="addContact()" style="width: 100px; margin-left: 150px; color: darkred;">Add Contact</button>

  <!-- Search Contact -->

  <input type="text" id="search" placeholder="Search contact" oninput="searchContact()" style="width: 200px; margin-left: 100px;"/>

  <!-- Contact List -->
  <h2 style="margin-left: 150px; color: darkred;">Contacts</h2>
  <ul id="contactList"></ul>
  </div>

    <script>
    // Contact list array
    let contacts = [];

    // Function to add contact
    function addContact() {
      let name = document.getElementById("name").value.trim();
      let phone = document.getElementById("phone").value.trim();

      if (name === "" || phone === "") {
        alert("Please enter both name and phone number");
        return;
      }
      
      contacts.push({ name, phone }); // add object to array
      
 
      document.getElementById("name").value = "";
      document.getElementById("phone").value = "";

      displayContacts();

     }

    // Function to display contacts
    function displayContacts() {
      let list = document.getElementById("contactList");
      list.innerHTML = ""; // clear list

      contacts.forEach((contact,index) => {
        let li = document.createElement("li");
        li.textContent = `${contact.name} - ${contact.phone}`
        list.appendChild(li);
         
        // delete button functionality
        let deletebtn=document.createElement("button");
        deletebtn.className="deletebtn";
        deletebtn.textContent="Delete"
        deletebtn.onclick=function(){
          deletecontact(index)
        }
          li.appendChild(deletebtn)

      })
        
    }
    // function for deletecontact
    function deletecontact(index){
            contacts.splice(index,1)
            displayContacts()
          }
         

    // Function to search contacts
    function searchContact() {
      let searchcontact = document.getElementById("search").value.toLowerCase().trim();

      let filtered = contacts.filter((c) => c.name.toLowerCase().includes(searchcontact));

      displayContacts(filtered);
    }

    
  </script>
</body>
</html>
