<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <style>
    body {
  font-family: 'Times New Roman', Times, serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.todo-container {
  background-color: rgba(234, 158, 18, 0.048);
  padding: 2em;
  border-radius: 8px;
  width: 400px;
  margin-top: 50px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

.input-section {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

input{
  flex-grow: 1;
  padding: 8px;
  border-radius: 4px;
  border: 1px solid #ccc;
}

#addbtn{
  padding: 8px 12px;
  background-color: #28a745;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

ul {
  list-style-type: none;
  padding: 0;
  margin-top: 20px;
}

li {
  display: flex;
  justify-content: space-between;
  background-color: rgba(234, 158, 18, 0.048);
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 4px;
}

li span {
  flex-grow: 1;
}

.btn1 {
  background-color:red;
  border: none;
  color:black;
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
}


  </style>
</head>
<body>
  <div class="todo-container">
    <h1>To-Do List</h1>
    <div class="input-section">
      <input type="text" id="task-input" placeholder="Add a new task">
      <button onclick="addTask()" id="addbtn">Add</button>
    </div>
    <ul id="task-list"></ul>
  </div>

  <script>
    function addTask() {
  const input = document.getElementById("task-input");
  const taskText = input.value.trim();

  if (taskText === "") return;

  const li = document.createElement("li");

  const span = document.createElement("span");
  span.textContent = taskText;

  const deleteBtn = document.createElement("button");
  deleteBtn.className="btn1"
  deleteBtn.textContent = "X";
  deleteBtn.onclick = ()=> {
    li.remove();

  }
  const cmpTask=document.createElement("button")
    cmpTask.textContent="completed"
    li.appendChild(cmpTask)
    cmpTask.onclick=()=>
            {
               deleteBtn.remove()
                cmpTask.style.backgroundColor="green"
            }

  li.appendChild(span);
  li.appendChild(deleteBtn);
  li.appendChild(cmpTask);

  document.getElementById("task-list").appendChild(li);

  input.value = ""; 
}

  </script>
</body>
</html>
